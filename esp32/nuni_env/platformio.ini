; 숨결지기 환경 노드 — ESP32 DevKit V1(ESP32-WROOM-32) + SCD41 + VL53L1X
; 빌드: 경로에 한글이 있으면 툴체인이 깨질 수 있어 ASCII 경로로 복사해서 빌드한다.
[env:nuni_env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sensirion/Sensirion I2C SCD4x@0.4.0
    pololu/VL53L1X@1.3.1
    bblanchon/ArduinoJson@7.2.1

build_flags =
    -DNUNI_RELAY_PIN=23
    -DNUNI_RELAY_ACTIVE_LOW=1
